version: '3'
dotenv: ['.env']

vars:
  # The pin lives in .agents/ateam.json; doctor fails when the binary that runs is another release. It installs into
  # the MAIN checkout's gitignored .tools/bin so every linked worktree shares it; scripts/ateam finds it.
  ATEAM_VERSION:
    sh: jq -r .ateam_version .agents/ateam.json
  ATEAM_BIN_DIR:
    sh: echo "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")/.tools/bin"

tasks:
  default:
    cmds: [task --list]
  test:
    desc: Offline unit tests with the race detector (no inference)
    cmds:
      - go test -race -count=1 ./...
  lint:
    desc: gofmt check on cmd, internal, untrusted, and verify, go vet, golangci-lint
    cmds:
      - test -z "$(gofmt -l cmd internal untrusted verify 2>/dev/null)"
      - go vet ./...
      - golangci-lint run
  check:
    desc: Offline tests and lint; establishes nothing about models
    cmds:
      - task: test
      - task: lint
  corpus:build:
    desc: Build corpus/cases.json and corpus.lock.json from corpus/draft
    cmds: [go run ./internal/corpus/cmd/corpustool build]
  corpus:validate:
    desc: Verify the corpus lock and validate every case
    cmds: [go run ./internal/corpus/cmd/corpustool validate]
  detonate:
    desc: Run the detonation corpus against the configured reader endpoint; -- --frame off|on|datamark|framing --verify free|schema --audit off|semselect|chat --trials N --out docs/evidence/<run>.json
    cmds: ['go run ./cmd/detonate {{.CLI_ARGS}}']
  matrix:
    desc: Render docs/results.md from result JSON files; -- --out docs/results.md docs/evidence/*.json
    cmds: ['go run ./cmd/detonate matrix {{.CLI_ARGS}}']
  tools:ateam:
    desc: Install the pinned ateam into the main checkout's .tools/bin (skips when already at the pin)
    status:
      - '"{{.ATEAM_BIN_DIR}}/ateam" version 2>/dev/null | grep -q "ateam {{.ATEAM_VERSION}} "'
    cmds:
      - GOBIN="{{.ATEAM_BIN_DIR}}" GOTOOLCHAIN=auto go install github.com/c360studio/ateam/cmd/ateam@{{.ATEAM_VERSION}}
  ateam:doctor:
    desc: ateam parity, hooks, and MCP budget check (no mutation)
    cmds: [scripts/ateam doctor --check]
  spec:check:
    desc: Strict OpenSpec validation and hold parsing
    cmds: [scripts/ateam state spec-check]
  spec:queue:
    desc: In-flight OpenSpec changes and their holds
    cmds: [scripts/ateam state spec-queue]
  test:spec:
    desc: Test-to-spec citations on tests changed since the base
    cmds: ['scripts/ateam test-spec --base "${TEST_SPEC_BASE:-origin/main}"']
  mutate:check:
    desc: Non-destructive mutation check via go test -overlay; -- -pkg ... -test ... -file ... -mutant ...
    cmds: ['scripts/ateam mutate {{.CLI_ARGS}}']
  merge:check:
    desc: ateam review gate for PR <n>; -- <n>. Reads GitHub, so not in verify
    cmds: ['ATEAM="${ATEAM:-scripts/ateam}" scripts/merge-check.sh {{.CLI_ARGS}}']
  verify:
    desc: Every local gate, cheapest first
    cmds:
      - task: ateam:doctor
      - task: spec:check
      - task: test:spec
      - task: check
