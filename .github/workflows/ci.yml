name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.51.1
      - name: Install golangci-lint
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - run: task check

  # Single required status check: anything other than success in a needed job fails it.
  required:
    name: Required
    needs: [check]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: ${RESULTS:-<none>}"
          [ -n "$RESULTS" ] || exit 1
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
